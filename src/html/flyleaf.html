<section class="section" id="reading_direction_info">
  <header><h2>Reading direction</h2></header>
  <label
    >Right-to-left book (manga, Arabic, Hebrew…):
    <input type="checkbox" name="right_to_left" />
    <span
      data-balloon-length="medium"
      aria-label="The spine ends up on the right: within every spread, the pages are mirrored so the book reads from right to left. Not applied to the small 'wacky' formats."
      data-balloon-pos="up"
      >ℹ️</span
    ></label
  >
</section>

<section class="section" id="flyleaf_info">
  <header><h2>Flyleafs</h2></header>
  <label
    >Add flyleafs: <input type="number" name="flyleafs" value="1" class="inline" />
    <span
      data-balloon-length="medium"
      aria-label="Extra blank pages at the start and end of the book"
      data-balloon-pos="up"
      >ℹ️</span
    ></label
  >
</section>
